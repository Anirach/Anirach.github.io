# GitHub Pages (Jekyll) build configuration.
#
# Sole purpose: keep internal working documents out of the PUBLISHED site.
# Everything listed below stays in the git repository — it is simply not copied
# into what anirach.com serves.
#
# Jekyll already omits any path beginning with "." or "_", which is why
# .claude/ and .superpowers/ are unreachable on the live site (verified 404),
# and why this file is not served either. The paths below do not get that
# protection automatically, so they are named explicitly.
#
# Deliberate exception to the repo rule "no new file starting with _": this is
# Jekyll's required config filename, and being unserved is exactly the point.
#
# To re-publish something, delete its line and push. To verify after any change:
#   curl -s -o /dev/null -w '%{http_code}' https://anirach.com/docs/superpowers/plans/2026-08-10-personal-platform-redesign.md   # expect 404
#   curl -s -o /dev/null -w '%{http_code}' https://anirach.com/                                                                  # expect 200

exclude:
  - docs        # design spec + implementation plan (internal working documents)
  - CLAUDE.md   # agent instructions for this repository
